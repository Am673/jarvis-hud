<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS // V3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#020b12;color:#bff7ff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}
main{width:min(900px,94vw);text-align:center}.orb{width:270px;height:270px;margin:15px auto;border:2px solid #59eaff;border-radius:50%;box-shadow:0 0 70px #0cf,inset 0 0 70px #0cf;display:grid;place-items:center;animation:pulse 3s infinite}
.core{width:105px;height:105px;border-radius:50%;background:#e8fdff;box-shadow:0 0 55px #0cf}.title{letter-spacing:.45em;font-size:21px}
.reply{font-size:21px;min-height:70px;margin:18px;line-height:1.45}.status{font-size:11px;letter-spacing:.2em;margin:10px;color:#79a6b4}
form{display:flex;gap:8px;margin-top:20px}input{flex:1;background:#03141d;color:#dffcff;border:1px solid #1d6577;border-radius:14px;padding:17px;font-size:16px}
button{background:#063044;color:#8fefff;border:1px solid #2aa6c4;border-radius:14px;padding:0 17px;font-size:16px}button.active{box-shadow:0 0 25px #36e8ff}
.hint{font-size:11px;color:#5f8794;margin-top:12px}
@keyframes pulse{50%{box-shadow:0 0 95px #0cf,inset 0 0 95px #0cf}}
</style>
</head>
<body>
<main>
<div class="orb"><div class="core"></div></div>
<div class="title">J A R V I S &nbsp; // &nbsp; V3</div>
<div id="reply" class="reply">Systems online. Say “Hey JARVIS” or use the microphone.</div>
<div id="status" class="status">VOICE STANDBY</div>
<form id="f"><input id="q" autocomplete="off" placeholder="Ask JARVIS anything..."><button id="mic" type="button">🎙</button><button type="submit">SEND</button></form>
<div class="hint">Wake phrase works while this page is actively listening. Browser/OS restrictions may prevent background listening.</div>
</main>
<script>
const ENDPOINT='https://grdbpodxopfnicbfulam.supabase.co/functions/v1/jarvis-agent';const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdyZGJwb2R4b3BmbmljYmZ1bGFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMjE2MTIsImV4cCI6MjEwMjg5NzYxMn0.4VeJMArPa3YyjOo9A5kiQRRfPCkzA7qw_-iZe0oinKg';
const q=document.getElementById('q'),r=document.getElementById('reply'),st=document.getElementById('status'),mic=document.getElementById('mic');
let listening=false,armed=false;
async function ask(message=q.value.trim()){
 if(!message)return;
 q.value='';
 st.textContent='THINKING';
 try{
  const res=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY},body:JSON.stringify({message})});
  const d=await res.json();
  if(!res.ok)throw new Error(d.error||'Request failed');
  r.textContent=d.reply; st.textContent=listening?'LISTENING FOR WAKE WORD':'VOICE STANDBY'; speak(d.reply);
 }catch(e){r.textContent='NEURAL CORE ERROR: '+e.message;st.textContent='SYSTEM ERROR'}
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();ask()};
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.95;u.pitch=.9;speechSynthesis.speak(u)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
 const x=new SR();x.lang='en-US';x.interimResults=false;x.continuous=true;
 x.onstart=()=>{listening=true;armed=true;st.textContent='LISTENING FOR “HEY JARVIS”';mic.classList.add('active')};
 x.onend=()=>{if(listening){try{x.start()}catch(e){}}else{st.textContent='VOICE STANDBY';mic.classList.remove('active')}};
 x.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){listening=false;st.textContent='MIC PERMISSION REQUIRED'}};
 x.onresult=e=>{
   const text=e.results[e.results.length-1][0].transcript.trim();
   const lower=text.toLowerCase();
   const idx=lower.indexOf('hey jarvis');
   if(idx>=0){const command=text.slice(idx+10).trim();if(command)ask(command);else{r.textContent='I’m listening.';speak('I’m listening.')}return}
   if(!armed)return;
 };
 mic.onclick=()=>{if(listening){listening=false;x.stop();return}try{x.start()}catch(e){}};
}else{mic.disabled=true;st.textContent='VOICE INPUT NOT SUPPORTED'}
</script>
</body>
</html>
